name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TextureCompressor.slnx

      - name: Build
        run: dotnet build TextureCompressor.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format TextureCompressor.slnx --verify-no-changes --verbosity minimal

      - name: Test
        run: dotnet test TextureCompressor.slnx --configuration Release --no-build --verbosity normal
